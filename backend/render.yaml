services:
  - type: web
    name: student-risk-api
    runtime: docker
    plan: free            # IMPORTANT : le plan par défaut d'un Blueprint est "starter" (payant)
    healthCheckPath: /health
    envVars:
      - key: APP_TRAINING_ENABLED
        value: "false"
      - key: APP_CORS_ORIGINS
        sync: false       # saisi dans le dashboard, ex. ["https://student-risk.pages.dev"]